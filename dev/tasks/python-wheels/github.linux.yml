{% import 'macros.jinja' as macros with context %}

{{ macros.github_header() }}

permissions:
  packages: write
  # required for OIDC token used to assume AWS_ROLE_ARN for sccache
  id-token: write
  # for archery crossbow upload-artifacts
  contents: write

jobs:
  build:
    name: "Build wheel for {{ linux_wheel_kind }} {{ linux_wheel_version }}"
    {% if arch == "amd64" %}
    runs-on: ubuntu-latest
    {% else %}
    runs-on: ubuntu-24.04-arm
    {% endif %}
    env:
      {% if linux_wheel_kind == "musllinux" %}
      ALPINE_LINUX: "3.23"
      {% endif %}
      # archery uses these environment variables
      {% if arch == "amd64" %}
      ARCH: amd64
      {% else %}
      ARCH: arm64/v8
      {% endif %}
      PYTHON: "{{ python_version }}"
      PYTHON_ABI_TAG: "{{ python_abi_tag }}"
      {% if python_version == "3.15" %}
      # TODO: Remove -rc suffix after 3.15 release
      PYTHON_IMAGE_TAG: "{{ python_version }}-rc"
      {% else %}
      PYTHON_IMAGE_TAG: "{{ python_version }}"
      {% endif %}
      SCCACHE_OIDC_ROLE: {{ '${{ secrets.AWS_ROLE_ARN }}' }}

    steps:
      {{ macros.github_checkout_arrow()|indent }}
      {# TEMPORARY: disabled to speed up sccache testing, restore before PR
      {{ macros.github_free_space()|indent }}
      #}
      {{ macros.github_install_archery()|indent }}
      {{ macros.github_login_dockerhub()|indent }}

      # Detect free-threaded Python builds
      - name: Prepare
        run: |
          if [[ "${PYTHON_ABI_TAG}" == *t ]]; then
            test_image_prefix=python-free-threaded
          else
            test_image_prefix=python
          fi
          echo "TEST_IMAGE_PREFIX=${test_image_prefix}" >> ${GITHUB_ENV}

      # Do the build image *before* sccache, to avoid long S3 credentials
      - name: Build image
        shell: bash
        env:
          GITHUB_TOKEN: {{ '${{ secrets.GITHUB_TOKEN }}' }}
        run: |
          if [ "{{ linux_wheel_kind }}" = "musllinux" ] && [ "{{ arch }}" = "arm64" ]; then
            # We can't use NuGet on musl arm systems because the official NuGet binary for arm doesn't exist.
            :
          else
            export VCPKG_BINARY_SOURCES="clear;nuget,GitHub,readwrite"
          fi
          archery docker run --build-only \
            python-wheel-{{ linux_wheel_kind }}-{{ linux_wheel_version }}

      - name: Show OIDC claims
        if: env.SCCACHE_OIDC_ROLE != ''
        shell: bash
        run: |
          TOKEN=$(curl -sS \
            -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=sts.amazonaws.com" | jq -r .value)
          python3 - "$TOKEN" <<'PY'
          import base64, json, sys
          p = sys.argv[1].split('.')[1]
          p += '=' * (-len(p) % 4)
          c = json.loads(base64.urlsafe_b64decode(p))
          keys = ('sub', 'aud', 'iss', 'repository', 'repository_owner', 'ref')
          print(json.dumps(dict((k, c.get(k)) for k in keys), indent=2))
          PY

      - name: Configure AWS credentials for sccache
        if: env.SCCACHE_OIDC_ROLE != ''
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: {{ '${{ secrets.SCCACHE_REGION }}' }}
          role-to-assume: {{ '${{ secrets.AWS_ROLE_ARN }}' }}

      - name: Build wheel
        shell: bash
        env:
          GITHUB_TOKEN: {{ '${{ secrets.GITHUB_TOKEN }}' }}
        {{ macros.github_set_sccache_envvars(sccache_error_log="/arrow/sccache.log",
                                             sccache_basedir="/tmp")|indent(8) }}
        run: |
          archery docker run --no-pull --no-build \
            -e SETUPTOOLS_SCM_PRETEND_VERSION={{ arrow.no_rc_version }} \
            -e CMAKE_VERBOSE_MAKEFILE={{ '${{ vars.CMAKE_VERBOSE_MAKEFILE || \'OFF\' }}' }} \
            python-wheel-{{ linux_wheel_kind }}-{{ linux_wheel_version }}

      - name: Upload sccache log
        if: {{ "${{ !cancelled() }}" }}
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: sccache-log-{{ python_abi_tag }}-{{ arch }}
          path: arrow/sccache.log
          if-no-files-found: ignore

      - uses: actions/upload-artifact@v4
        with:
          name: wheel
          path: arrow/python/repaired_wheels/*.whl

      # TODO(kszucs): auditwheel show
      - name: Test wheel
        shell: bash
        run: |
          source arrow/ci/scripts/util_enable_core_dumps.sh
          archery docker run ${TEST_IMAGE_PREFIX}-wheel-{{ linux_wheel_kind }}-test-imports
          archery docker run ${TEST_IMAGE_PREFIX}-wheel-{{ linux_wheel_kind }}-test-unittests

      - name: Test wheel on AlmaLinux 8
        shell: bash
        if: |
          '{{ python_version }}' == '3.12' && '{{ linux_wheel_kind }}' == 'manylinux'
        env:
          ALMALINUX: "8"
        run: |
          archery docker run \
            -e ARROW_GANDIVA=OFF \
            -e TEST_DEFAULT=0 \
            -e TEST_PYARROW_VERSION={{ arrow.no_rc_version }} \
            -e TEST_PYTHON_VERSIONS={{ python_version }} \
            -e TEST_WHEEL_PLATFORM_TAGS={{ wheel_platform_tag }} \
            -e TEST_WHEELS=1 \
            almalinux-verify-rc

      - name: Test wheel on Ubuntu 22.04
        shell: bash
        if: |
          '{{ python_version }}' == '3.11' && '{{ linux_wheel_kind }}' == 'manylinux'
        env:
          UBUNTU: "22.04"
        run: |
          archery docker run \
            -e TEST_DEFAULT=0 \
            -e TEST_PYARROW_VERSION={{ arrow.no_rc_version }} \
            -e TEST_PYTHON_VERSIONS={{ python_version }} \
            -e TEST_WHEEL_PLATFORM_TAGS={{ wheel_platform_tag }} \
            -e TEST_WHEELS=1 \
            ubuntu-verify-rc

      - name: Test wheel on Ubuntu 24.04
        shell: bash
        if: |
          '{{ python_version }}' == '3.12' && '{{ linux_wheel_kind }}' == 'manylinux'
        env:
          UBUNTU: "24.04"
        run: |
          archery docker run \
            -e TEST_DEFAULT=0 \
            -e TEST_PYARROW_VERSION={{ arrow.no_rc_version }} \
            -e TEST_PYTHON_VERSIONS={{ python_version }} \
            -e TEST_WHEEL_PLATFORM_TAGS={{ wheel_platform_tag }} \
            -e TEST_WHEELS=1 \
            ubuntu-verify-rc

      {{ macros.github_upload_releases("arrow/python/repaired_wheels/*.whl")|indent }}
      {{ macros.github_upload_wheel_scientific_python("arrow/python/repaired_wheels/*.whl")|indent }}

      {% if arrow.is_default_branch() %}
      - name: Push Docker images
        shell: bash
        run: |
          archery docker push python-wheel-{{ linux_wheel_kind }}-{{ linux_wheel_version }}
          archery docker push ${TEST_IMAGE_PREFIX}-wheel-{{ linux_wheel_kind }}-test-unittests
      {% endif %}
